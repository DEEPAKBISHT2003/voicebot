[pytest]
addopts = -v --tb=short
testpaths = 
    packages/domain-models/tests
    services/interview/tests
    services/copilot/tests
    tests/integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
