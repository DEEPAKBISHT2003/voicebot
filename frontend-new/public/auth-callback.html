<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Microsoft Authentication</title>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #334155; margin: 0;">
  <div style="text-align: center;">
    <div style="width: 36px; height: 36px; border: 3px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
    <p style="font-size: 15px; font-weight: 600; margin: 0;">Completing Microsoft authentication...</p>
    <p style="font-size: 13px; color: #64748b; margin-top: 6px;">This window will close automatically.</p>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script type="module">
    try {
      const urlHash = window.location.hash;
      const urlQuery = window.location.search;
      let payload = "";
      if (urlHash && urlHash.length > 1) {
        payload = urlHash.charAt(0) === "#" ? urlHash.substring(1) : urlHash;
      } else if (urlQuery && urlQuery.length > 1) {
        payload = urlQuery.charAt(0) === "?" ? urlQuery.substring(1) : urlQuery;
      }

      if (payload) {
        const params = new URLSearchParams(payload);
        const state = params.get("state");
        if (state) {
          const splitState = state.split("|");
          const libraryState = JSON.parse(atob(splitState[0]));
          if (libraryState && libraryState.id) {
            const channel = new BroadcastChannel(libraryState.id);
            channel.postMessage({ v: 1, payload });
            channel.close();
          }
        }
        // Scrub authorization code and state from URL to prevent exposure in browser history
        window.history.replaceState(null, document.title, window.location.pathname);
      }
      setTimeout(() => {
        try { window.close(); } catch {}
      }, 500);
    } catch (e) {
      console.error("[MSAL Callback] Error:", e);
    }
  </script>
</body>
</html>
