# Shared gateway rate-limiting zones (tracks IP addresses across all backend workers)
limit_req_zone $binary_remote_addr zone=gateway_auth_login:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=gateway_auth_ms:10m rate=60r/m;

server {
    listen 80;
    server_name localhost;

    # Allow large payload uploads (resumes and audio recordings)
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gateway rate-limited endpoint: Email/Password login
    location = /api/auth/login {
        limit_req zone=gateway_auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-services:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login/ {
        limit_req zone=gateway_auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-services:8000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway rate-limited endpoint: Microsoft SSO token exchange
    location = /api/auth/microsoft {
        limit_req zone=gateway_auth_ms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-services:8000/api/auth/microsoft;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/microsoft/ {
        limit_req zone=gateway_auth_ms burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-services:8000/api/auth/microsoft;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to Copilot Service
    location /api/copilot/ {
        proxy_pass http://backend-services:8000/api/copilot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket connections to Copilot Service
    location /api/ws/copilot/ {
        proxy_pass http://backend-services:8000/api/ws/copilot/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy WebSocket connections to Interview Service
    location /api/ws/interview/ {
        proxy_pass http://backend-services:8000/api/ws/interview/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Proxy generic API requests to Backend Services
    location /api/ {
        proxy_pass http://backend-services:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
