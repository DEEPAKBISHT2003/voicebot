services:
  db:
    image: postgres:15-alpine
    container_name: voicebot-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview}"]
      interval: 5s
      timeout: 5s
      retries: 5

  interview-service:
    build:
      context: ./services/interview
      dockerfile: Dockerfile
    container_name: voicebot-interview-service
    restart: always
    ports:
      - "${INTERVIEW_PORT:-8000}:${INTERVIEW_PORT:-8000}"
    environment:
      - INTERVIEW_PORT=${INTERVIEW_PORT:-8000}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-interview}}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_COPILOT_MODEL=${GROQ_COPILOT_MODEL:-llama-3.1-8b-instant}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - COPILOT_URL=${COPILOT_INTERNAL_URL:-http://copilot-service:${COPILOT_PORT:-8001}}
      - COPILOT_SERVICE_URL=${COPILOT_INTERNAL_URL:-http://copilot-service:${COPILOT_PORT:-8001}}
    volumes:
      - ./interviews:/app/interviews
    depends_on:
      db:
        condition: service_healthy
      copilot-service:
        condition: service_healthy

  copilot-service:
    build:
      context: ./services/copilot
      dockerfile: Dockerfile
    container_name: voicebot-copilot-service
    restart: always
    ports:
      - "${COPILOT_PORT:-8001}:${COPILOT_PORT:-8001}"
    environment:
      - COPILOT_PORT=${COPILOT_PORT:-8001}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-interview}}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_COPILOT_MODEL=${GROQ_COPILOT_MODEL:-llama-3.1-8b-instant}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - BACKEND_WS_BASE=${BACKEND_WS_BASE:-ws://localhost:${COPILOT_PORT:-8001}}
    volumes:
      - ./interviews:/app/interviews
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,urllib.request; urllib.request.urlopen(f\"http://localhost:{os.getenv(\"COPILOT_PORT\",\"8001\")}/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_COPILOT_URL=${VITE_COPILOT_URL:-}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
    container_name: voicebot-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - interview-service
      - copilot-service

volumes:
  postgres_data:
