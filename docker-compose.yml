services:
  db:
    image: postgres:15-alpine
    container_name: voicebot-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interview}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-services:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-backend-services
    restart: always
    ports:
      - "${INTERVIEW_PORT:-8000}:8000"
      - "${BROWSER_PORT:-8002}:8002"
    environment:
      - INTERVIEW_PORT=${INTERVIEW_PORT:-8000}
      - COPILOT_PORT=${COPILOT_PORT:-8000}
      - DATABASE_URL=${DATABASE_URL_DOCKER:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-1234}@db:5432/${POSTGRES_DB:-interview}}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_COPILOT_MODEL=${GROQ_COPILOT_MODEL:-llama-3.1-8b-instant}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - COPILOT_URL=http://localhost:${COPILOT_PORT:-8000}
      - COPILOT_SERVICE_URL=http://localhost:${COPILOT_PORT:-8000}
      - BROWSER_SERVICE_URL=http://localhost:8002
      - BROWSER_URL=http://localhost:8002
      - BACKEND_WS_BASE=${BACKEND_WS_BASE:-ws://localhost:${COPILOT_PORT:-8000}}
      - COPILOT_WS_BASE=${COPILOT_WS_BASE:-ws://localhost:${COPILOT_PORT:-8000}}
    volumes:
      - ./interviews:/app/interviews
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  browser-service:
    build:
      context: ./services/browser
      dockerfile: Dockerfile
    container_name: voicebot-browser-service
    restart: always
    network_mode: "service:backend-services"
    environment:
      - BROWSER_PORT=${BROWSER_PORT:-8002}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME:-Mia - AI Interviewer}
      - BOT_ROLE=${BOT_ROLE:-interviewer}
      - BOT_HEADLESS=${BOT_HEADLESS:-true}
      - BOT_PREJOIN_TIMEOUT_MS=${BOT_PREJOIN_TIMEOUT_MS:-45000}
      - LOCAL_AUDIO_WS_BASE=${LOCAL_AUDIO_WS_BASE:-ws://localhost:8000}
      - COPILOT_PORT=${COPILOT_PORT:-8000}
    volumes:
      - ./interviews:/app/interviews
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_COPILOT_URL=${VITE_COPILOT_URL:-}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
    container_name: voicebot-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend-services

volumes:
  postgres_data:
