services:
  db:
    image: postgres:15-alpine
    container_name: voicebot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  interview-service:
    build:
      context: ./services/interview
      dockerfile: Dockerfile
    container_name: voicebot-interview-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:1234@db:5432/interview}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_COPILOT_MODEL=${GROQ_COPILOT_MODEL:-llama-3.1-8b-instant}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - COPILLOT_SERVICE_URL=${COPILLOT_SERVICE_URL:-http://copilot-service:8001}
    depends_on:
      - db

  copilot-service:
    build:
      context: ./services/copilot
      dockerfile: Dockerfile
    container_name: voicebot-copilot-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:1234@db:5432/interview}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
    container_name: voicebot-frontend
    restart: always
    depends_on:
      - interview-service
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
